<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="forgot-password.css">
</head>
<body>
    <div class="forgot-card">
        <h1>Set New Password</h1>
        <p>Enter your new password below.</p>

        <form id="resetForm">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    placeholder="Enter new password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm new password"
                    required
                >
            </div>

            <button type="submit" class="reset-btn">Update Password</button>
            <div id="resetMessage" class="message"></div>
        </form>

        <div class="back-section">
            <p><a href="login.html" class="back-link">Back to Login</a></p>
        </div>
    </div>

    <script>
        const resetForm = document.getElementById('resetForm');
        const resetMessage = document.getElementById('resetMessage');

        function showMessage(text, isError = false) {
            resetMessage.textContent = text;
            resetMessage.style.display = 'block';
            resetMessage.style.background = isError ? '#fee2e2' : '#dcfce7';
            resetMessage.style.color = isError ? '#991b1b' : '#166534';
        }

        resetForm.addEventListener('submit', function (event) {
            event.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!newPassword || !confirmPassword) {
                showMessage('Please fill in both password fields.', true);
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match.', true);
                return;
            }

            if (newPassword.length < 6) {
                showMessage('Password must be at least 6 characters long.', true);
                return;
            }

            // In a real application, you'd verify the reset token here
            // For demo purposes, we'll just show success
            showMessage('Password updated successfully! You can now log in with your new password.', false);

            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        });
    </script>
</body>
</html>
